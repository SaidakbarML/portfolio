name: Deploy to GitHub Pages

# Free hosting path: builds the static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          # Project sites live at /<repo>, user sites (<user>.github.io) at /.
          BASE_PATH: ${{ endsWith(github.repository, format('{0}.github.io', github.repository_owner)) && '' || format('/{0}', github.event.repository.name) }}
        run: npm run build:static

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
